name: Deploy Release (32-bit Only)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g., v1.0.0-32bit)'
        required: true
        default: 'v1.0.0-32bit'

jobs:
  build-32bit:
    name: Build 32-bit (armeabi-v7a)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: devel

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # SPECIALIST STEP: Dynamically force 32-bit config
      # This checks if you use Groovy or Kotlin DSL and appends the correct block
      - name: Inject 32-bit Split Config
        run: |
          echo "Injecting ABI split configuration for armeabi-v7a..."
          
          if [ -f "app/build.gradle.kts" ]; then
            echo "Detected Kotlin DSL..."
            cat <<EOF >> app/build.gradle.kts
            android {
                splits {
                    abi {
                        isEnable = true
                        reset()
                        include("armeabi-v7a")
                        isUniversalApk = false
                    }
                }
            }
          EOF
          elif [ -f "app/build.gradle" ]; then
            echo "Detected Groovy DSL..."
            cat <<EOF >> app/build.gradle
            android {
                splits {
                    abi {
                        enable true
                        reset()
                        include 'armeabi-v7a'
                        universalApk false
                    }
                }
            }
          EOF
          else
            echo "Error: Could not find app/build.gradle or app/build.gradle.kts"
            exit 1
          fi

      - name: Generate Signing Keystore
        run: |
          keytool -genkey -v \
            -keystore release.keystore \
            -alias android_release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Release 32, OU=App, O=Org, L=City, S=State, C=US"

      - name: Build Signed 32-bit APK
        run: |
          chmod +x gradlew
          ./gradlew app:assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/release.keystore \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=android_release \
            -Pandroid.injected.signing.key.password=android

      - name: Create Release and Upload 32-bit APK
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: Release ${{ github.event.inputs.release_tag }}
          # The filename changes when splits are enabled, usually including the ABI name
          files: app/build/outputs/apk/release/*armeabi-v7a*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
