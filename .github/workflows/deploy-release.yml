name: Deploy Release

# Trigger manually and ask for the version tag
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build-and-release:
    name: Build and Release APK
    runs-on: ubuntu-latest
    
    # Permission required to create Releases and upload assets
    permissions:
      contents: write

    steps:
      # 1. Checkout the specific development branch
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: devel
      
      # 2. Setup Java 17 (Required for modern Android builds)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # 3. Generate a temporary Keystore for signing
      #    We use a fixed password 'android' since security is not a concern here.
      - name: Generate Signing Keystore
        run: |
          echo "Generating temporary keystore..."
          keytool -genkey -v \
            -keystore release.keystore \
            -alias android_release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Release, OU=App, O=Org, L=City, S=State, C=US"
          
          echo "Keystore created at $(pwd)/release.keystore"

      # 4. Build the Release APK
      #    We inject the signing configuration directly via Gradle properties
      - name: Build Signed APK
        run: |
          chmod +x gradlew
          ./gradlew app:assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/release.keystore \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=android_release \
            -Pandroid.injected.signing.key.password=android

      # 5. Publish to GitHub Releases
      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: Release ${{ github.event.inputs.release_tag }}
          files: app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
